[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-linux-hardening"
version = "1.1.0"
description = "Linux security auditing and safe hardening framework"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Aegis Contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.setuptools.data-files]
"share/man/man1" = ["docs/aegis.1"]
"share/bash-completion/completions" = ["completions/aegis.bash"]
"share/zsh/site-functions" = ["completions/_aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
